name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Test + package JAR & APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache android.jar
        id: cache-android
        uses: actions/cache@v4
        with:
          path: android-sdk/platforms/android-35/android.jar
          key: android-jar-platform-35_r01

      - name: Fetch android.jar
        if: steps.cache-android.outputs.cache-hit != 'true'
        run: ./scripts/fetch-android-platform.sh 35

      - name: Build JAR (runs core tests)
        run: ./scripts/build-jar.sh
        env:
          # CI builds of untagged commits publish as SNAPSHOT-like local only.
          VERSION: 0.0.0-ci

      - name: Build Demo APK
        run: |
          chmod +x scripts/build-demo-apk.sh
          ./scripts/build-demo-apk.sh

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codeeditor-jar
          path: |
            dist/codeeditor-*.jar
            dist/codeeditor-*.pom
          if-no-files-found: error

      - name: Upload Demo APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeeditor-demo-apk
          path: dist/CodeEditor-demo.apk
          if-no-files-found: error
